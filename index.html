<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Shopping · Metro de Madrid</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #DA291C;
    --azul: #003DA5;
    --gris-oscuro: #1a1a2e;
    --blanco: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--gris-oscuro);
    color: var(--blanco);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--blanco);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
    border-bottom: 4px solid var(--rojo);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .logo-area { display: flex; align-items: center; gap: 1.2rem; }

  .metro-logo { width: 48px; height: 48px; flex-shrink: 0; }

  .brand-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--rojo);
    letter-spacing: 2px;
    line-height: 1;
  }

  .brand-text p {
    font-size: 0.7rem;
    color: #666;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .tipo-badge {
    background: var(--azul);
    color: white;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0.3rem 0.9rem;
    border-radius: 20px;
    display: none;
  }

  .status-bar {
    background: rgba(0,61,165,0.25);
    padding: 0.45rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.77rem;
    color: rgba(255,255,255,0.55);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #aaa;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.loading { background: #facc15; animation: pulse 1s infinite; }
  .status-dot.ok      { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .status-dot.error   { background: #f87171; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #report-iframe {
    flex: 1;
    border: none;
    width: 100%;
    background: white;
    display: none;
  }

  .error-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 2rem;
  }

  .error-screen svg { width: 56px; height: 56px; opacity: 0.2; }

  .error-screen h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
  }

  .error-screen p { font-size: 0.85rem; max-width: 340px; line-height: 1.6; }

  .error-screen code {
    background: rgba(255,255,255,0.07);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    font-size: 0.8rem;
    color: #facc15;
  }

  footer {
    background: #111122;
    padding: 0.55rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.22);
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <svg class="metro-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="12" fill="#DA291C"/>
      <text x="50" y="68" font-family="Arial Black,sans-serif" font-size="62" font-weight="900"
            fill="white" text-anchor="middle">M</text>
    </svg>
    <div class="brand-text">
      <h1>Metro de Madrid</h1>
      <p>Mystery Shopping · Visor de Informes</p>
    </div>
  </div>
  <span class="tipo-badge" id="tipo-badge"></span>
</header>

<div class="status-bar">
  <span class="status-dot loading" id="status-dot"></span>
  <span id="status-text">Iniciando…</span>
</div>

<iframe id="report-iframe" allowfullscreen></iframe>

<div class="error-screen" id="error-screen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 8v4M12 16h.01"/>
  </svg>
  <h2>Parámetros incorrectos</h2>
  <p id="error-msg"></p>
  <p>Formato esperado:<br><code>index.html?tipo=CE&amp;id=10334</code></p>
  <p>Tipos válidos: <code>CE</code> · <code>CT</code> · <code>LT</code> · <code>VIG</code></p>
</div>

<footer>
  <span>Metro de Madrid · Mystery Shopping Dashboard</span>
  <span id="footer-info"></span>
</footer>

<script>
  const REPORTS = {
    CE:  { label:'CE – Cliente Externo',  reportId:'745f3223-0df8-4943-a0bd-0b61d43c1916', groupId:'83b96d00-0bbf-44ba-8c8a-0931bd9993d0', table:'LE_CE_Datos',   field:'TITULO'  },
    CT:  { label:'CT – Coches de Tren',   reportId:'63c4d082-a5ce-4db2-8576-afd7af0968a3', groupId:'83b96d00-0bbf-44ba-8c8a-0931bd9993d0', table:'CT',            field:'TITULO'  },
    LT:  { label:'LT – Línea de Tren',    reportId:'40919cd6-ac26-4077-828f-d2dc850bc8c5', groupId:'83b96d00-0bbf-44ba-8c8a-0931bd9993d0', table:'LT',            field:'Título'  },
    VIG: { label:'VIG – Vigilancia',      reportId:'2ff905d4-9850-41f1-bb3b-ae98b5eedd73', groupId:'83b96d00-0bbf-44ba-8c8a-0931bd9993d0', table:'VIG_SinAgrupar',field:'TITULO'  }
  };

  function setStatus(state, msg) {
    document.getElementById('status-dot').className = 'status-dot ' + state;
    document.getElementById('status-text').textContent = msg;
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-screen').style.display = 'flex';
    setStatus('error', 'Error: ' + msg);
  }

  var params = new URLSearchParams(window.location.search);
  var tipo   = (params.get('tipo') || '').toUpperCase();
  var id     = (params.get('id')   || '').trim();

  if (!tipo || !id) {
    showError('Faltan parámetros tipo e id en la URL.');
  } else if (!REPORTS[tipo]) {
    showError('Tipo "' + tipo + '" no reconocido. Usa CE, CT, LT o VIG.');
  } else {
    var cfg = REPORTS[tipo];

    var badge = document.getElementById('tipo-badge');
    badge.textContent = cfg.label;
    badge.style.display = 'inline-block';

    document.getElementById('footer-info').textContent =
      cfg.table + '/' + cfg.field + " = '" + id + "'";

    var filterStr     = cfg.table + '/' + cfg.field + " eq '" + id + "'";
    var encodedFilter = encodeURIComponent(filterStr);
    var url = 'https://app.powerbi.com/reportEmbed'
            + '?filter='   + encodedFilter
            + '&reportId=' + cfg.reportId
            + '&groupId='  + cfg.groupId
            + '&autoAuth=true'
            + '&filterPaneEnabled=false'
            + '&navContentPaneEnabled=false';

    setStatus('loading', 'Cargando ' + cfg.label + ' · ID: ' + id + ' …');

    var iframe = document.getElementById('report-iframe');
    iframe.style.display = 'block';

    iframe.onload = function() {
      setStatus('ok', '✓ Informe cargado · ' + cfg.label + ' · ID: ' + id);
    };

    iframe.src = url;
  }
</script>
</body>
</html>
