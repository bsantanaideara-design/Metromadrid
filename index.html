<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Shopping · Metro de Madrid</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #DA291C;
    --azul: #003DA5;
    --gris-oscuro: #1a1a2e;
    --blanco: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--gris-oscuro);
    color: var(--blanco);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--blanco);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
    border-bottom: 4px solid var(--rojo);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .logo-area { display: flex; align-items: center; gap: 1.2rem; }

  .metro-logo { height: 52px; width: auto; flex-shrink: 0; object-fit: contain; }

  .brand-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--rojo);
    letter-spacing: 2px;
    line-height: 1;
  }

  .brand-text p {
    font-size: 0.7rem;
    color: #666;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .tipo-badge {
    background: var(--azul);
    color: white;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0.3rem 0.9rem;
    border-radius: 20px;
    display: none;
  }

  .status-bar {
    background: rgba(0,61,165,0.25);
    padding: 0.45rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.77rem;
    color: rgba(255,255,255,0.55);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #aaa;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.loading { background: #facc15; animation: pulse 1s infinite; }
  .status-dot.ok      { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .status-dot.error   { background: #f87171; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #report-iframe {
    flex: 1;
    border: none;
    width: 100%;
    background: white;
    display: none;
  }

  .error-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 2rem;
  }

  .error-screen svg { width: 56px; height: 56px; opacity: 0.2; }

  .error-screen h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
  }

  .error-screen p { font-size: 0.85rem; max-width: 340px; line-height: 1.6; }

  .error-screen code {
    background: rgba(255,255,255,0.07);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    font-size: 0.8rem;
    color: #facc15;
  }

  footer {
    background: #111122;
    padding: 0.55rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.22);
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
</style>
</head>
