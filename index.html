<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mystery Shopping · Metro de Madrid</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:      #DA0027;
      --red-dark: #A8001E;
      --red-light:#FF1A3C;
      --white:    #FFFFFF;
      --off-white:#F5F5F5;
      --gray-100: #EBEBEB;
      --gray-300: #BEBEBE;
      --gray-500: #7A7A7A;
      --gray-700: #3D3D3D;
      --black:    #1A1A1A;
      --shadow:   0 2px 16px rgba(0,0,0,0.12);
    }

    html, body {
      height: 100%;
      font-family: 'Barlow', sans-serif;
      background: var(--off-white);
      color: var(--black);
    }

    /* ── HEADER ── */
    header {
      background: var(--red);
      color: var(--white);
      display: flex;
      align-items: stretch;
      height: 64px;
      position: relative;
      z-index: 100;
      box-shadow: 0 3px 12px rgba(218,0,39,0.35);
    }

    .header-logo {
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 14px;
      border-right: 1px solid rgba(255,255,255,0.2);
      text-decoration: none;
    }

    /* Metro diamond logo */
    .metro-diamond {
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .header-brand .name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-brand .sub {
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .header-title {
      display: flex;
      align-items: center;
      padding: 0 28px;
      flex: 1;
      gap: 10px;
    }

    .header-title .label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .header-title .separator {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.3);
    }

    .header-title .module {
      font-size: 0.8rem;
      font-weight: 400;
      opacity: 0.75;
      letter-spacing: 0.5px;
    }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      padding: 8px 24px;
      font-size: 0.72rem;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
    }

    .breadcrumb span { color: var(--gray-300); }
    .breadcrumb strong { color: var(--red); font-weight: 600; }

    /* ── REPORT AREA ── */
    .report-area {
      padding: 20px 24px 24px;
      height: calc(100vh - 64px - 33px);
      min-height: 480px;
    }

    .report-card {
      background: var(--white);
      border-radius: 6px;
      border: 1px solid var(--gray-100);
      box-shadow: var(--shadow);
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Red top accent line */
    .report-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--red);
      z-index: 2;
    }

    #pbi-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── LOADING ── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      opacity: 0.15;
    }

    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--gray-100);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-300);
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--red);
      color: white;
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(218,0,39,0.35);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }

    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── FOOTER ── */

  </style>
</head>

      document.getElementById("loading").classList.toggle("hidden", !on);
    }

    document.getElementById("pbi-frame").addEventListener("load", () => showLoading(false));

    document.getElementById("clave-input").addEventListener("keydown", e => {
      if (e.key === "Enter") applyFilter();
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    // Leer claveid desde URL (?claveid=16937)
    const urlParams = new URLSearchParams(window.location.search);
    const paramId = urlParams.get("claveid");
    if (paramId) {
      document.getElementById("clave-input").value = paramId;
    }

    applyFilter();
  </script>
</body>
</html>
